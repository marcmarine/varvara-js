<head>
  <script src="./dist/va-code-block.js" type="module"></script>
  <link href="https://unpkg.com/varvara-css" rel="stylesheet" type="text/css" />
</head>

<body style="display: flex; flex-direction: column; gap: 2rem; padding: 1rem">
  <h1>Code Block Example</h1>
  <h2>One Dark</h2>
  <va-code-block language="css" text='@import url("https://unpkg.com/varvara-css");'></va-code-block>
  <h2>Nord</h2>
  <va-code-block
    language="html"
    theme="nord"
    text='<link
  href="https://unpkg.com/varvara-css"
  rel="stylesheet"
  type="text/css"
/>'
  ></va-code-block>
  <h2>One Light</h2>
  <va-code-block language="html" theme="one-light" text='<button class="va-button">Example button</button>'></va-code-block>
  <h2>Multiple languages</h2>
  <va-code-block selected="bun">
    <pre data-label="npm"><code class="language-bash">npm i va-code-block</code></pre>
    <pre data-label="pnpm"><code class="language-bash">pnpm add va-code-block</code></pre>
    <pre data-label="bun"><code class="language-bash">bun add va-code-block</code></pre>
  </va-code-block>
  <va-code-block>
    <pre><code class="language-html">&lt;button class="va-button"&gt;Example button&lt;/button&gt;</code></pre>
    <pre><code class="language-css">.va-button { --va-button-padding: var(--va-space-4); }</code></pre>
  </va-code-block>
</body>
